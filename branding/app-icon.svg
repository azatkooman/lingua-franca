<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lingua Franca app icon. Two speech bubbles: the original speech (white) and the
       interpreted audio (green, with sound bars), on the app's violet. Used at 48 px and up;
       app-icon-small.svg is the simplified version for 16 to 40 px. -->
  <defs>
    <linearGradient id="lf-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="lf-green" x1="0" y1="196" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <!-- Cuts a gap around the front bubble so the two read as separate shapes at any size. -->
    <mask id="lf-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round">
        <rect x="196" y="196" width="216" height="176" rx="54"/>
        <path d="M336 360 L392 420 L384 360 Z"/>
      </g>
    </mask>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#lf-bg)"/>
  <g mask="url(#lf-cut)">
    <g fill="#fff">
      <rect x="100" y="104" width="216" height="164" rx="52"/>
      <path d="M126 256 L112 318 L172 256 Z"/>
    </g>
    <g fill="#7c3aed">
      <circle cx="150" cy="146" r="15"/>
      <circle cx="196" cy="146" r="15"/>
      <circle cx="242" cy="146" r="15"/>
    </g>
  </g>
  <g fill="url(#lf-green)">
    <rect x="196" y="196" width="216" height="176" rx="54"/>
    <path d="M336 360 L392 420 L384 360 Z"/>
  </g>
  <g fill="#fff">
    <rect x="239" y="262" width="18" height="44" rx="9"/>
    <rect x="267" y="240" width="18" height="88" rx="9"/>
    <rect x="295" y="222" width="18" height="124" rx="9"/>
    <rect x="323" y="244" width="18" height="80" rx="9"/>
    <rect x="351" y="264" width="18" height="40" rx="9"/>
  </g>
</svg>
