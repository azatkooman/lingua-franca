<svg xmlns="http://www.w3.org/2000/svg" viewBox="84 88 344 344">
  <!-- The bubbles without the app-icon tile, for dark backgrounds: the in-app header, the
       startup screen and banners. Same shapes as app-icon.svg; the back bubble turns violet
       so it still reads on dark navy. -->
  <defs>
    <linearGradient id="lf-violet" x1="100" y1="104" x2="316" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lf-green-m" x1="0" y1="196" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <mask id="lf-cut-m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round">
        <rect x="196" y="196" width="216" height="176" rx="54"/>
        <path d="M336 360 L392 420 L384 360 Z"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#lf-cut-m)">
    <g fill="url(#lf-violet)">
      <rect x="100" y="104" width="216" height="164" rx="52"/>
      <path d="M126 256 L112 318 L172 256 Z"/>
    </g>
    <g fill="#fff">
      <circle cx="150" cy="146" r="15"/>
      <circle cx="196" cy="146" r="15"/>
      <circle cx="242" cy="146" r="15"/>
    </g>
  </g>
  <g fill="url(#lf-green-m)">
    <rect x="196" y="196" width="216" height="176" rx="54"/>
    <path d="M336 360 L392 420 L384 360 Z"/>
  </g>
  <g fill="#fff">
    <rect x="239" y="262" width="18" height="44" rx="9"/>
    <rect x="267" y="240" width="18" height="88" rx="9"/>
    <rect x="295" y="222" width="18" height="124" rx="9"/>
    <rect x="323" y="244" width="18" height="80" rx="9"/>
    <rect x="351" y="264" width="18" height="40" rx="9"/>
  </g>
</svg>
