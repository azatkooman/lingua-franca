<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Lingua Franca</title>
    <style>
      :root { --bg: #0d0f17; --surface: #1a1d2d; --primary: #8b5cf6; --danger: #ef4444; --text: #e6e8f0; --muted: #8b90a8; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--text); padding: 2rem;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      }
      .panel { max-width: 34rem; width: 100%; text-align: center; }
      .mark { display: block; width: 5rem; height: 5rem; margin: 0 auto 1rem; }
      .logo { font-size: 2rem; font-weight: 700; margin: 0 0 .5rem; }
      .logo span { color: var(--primary); }
      .muted { color: var(--muted); line-height: 1.6; }
      .spinner {
        width: 2.5rem; height: 2.5rem; margin: 2rem auto 0; border-radius: 50%;
        border: 3px solid rgba(139, 92, 246, .25); border-top-color: var(--primary);
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
      .error {
        display: none; margin-top: 1.75rem; padding: 1.25rem 1.5rem; text-align: left;
        background: var(--surface); border: 1px solid var(--danger);
        border-radius: .75rem;
      }
      .error h2 { margin: 0 0 .5rem; font-size: 1.05rem; color: var(--danger); }
      .error p { margin: 0 0 1rem; word-break: break-word; }
      .error ul { margin: 0; padding-left: 1.25rem; }
      .error li { margin-bottom: .4rem; }
      body.failed .spinner, body.failed .starting { display: none; }
      body.failed .error { display: block; }
    </style>
  </head>
  <body>
    <div class="panel">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="84 88 344 344">
        <defs>
          <linearGradient id="lf-violet" x1="100" y1="104" x2="316" y2="318" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#a78bfa"/>
            <stop offset="1" stop-color="#7c3aed"/>
          </linearGradient>
          <linearGradient id="lf-green-m" x1="0" y1="196" x2="0" y2="420" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#34d399"/>
            <stop offset="1" stop-color="#059669"/>
          </linearGradient>
          <mask id="lf-cut-m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
            <rect width="512" height="512" fill="#fff"/>
            <g fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round">
              <rect x="196" y="196" width="216" height="176" rx="54"/>
              <path d="M336 360 L392 420 L384 360 Z"/>
            </g>
          </mask>
        </defs>
        <g mask="url(#lf-cut-m)">
          <g fill="url(#lf-violet)">
            <rect x="100" y="104" width="216" height="164" rx="52"/>
            <path d="M126 256 L112 318 L172 256 Z"/>
          </g>
          <g fill="#fff">
            <circle cx="150" cy="146" r="15"/>
            <circle cx="196" cy="146" r="15"/>
            <circle cx="242" cy="146" r="15"/>
          </g>
        </g>
        <g fill="url(#lf-green-m)">
          <rect x="196" y="196" width="216" height="176" rx="54"/>
          <path d="M336 360 L392 420 L384 360 Z"/>
        </g>
        <g fill="#fff">
          <rect x="239" y="262" width="18" height="44" rx="9"/>
          <rect x="267" y="240" width="18" height="88" rx="9"/>
          <rect x="295" y="222" width="18" height="124" rx="9"/>
          <rect x="323" y="244" width="18" height="80" rx="9"/>
          <rect x="351" y="264" width="18" height="40" rx="9"/>
        </g>
      </svg>
      <h1 class="logo">Lingua<span>Franca</span></h1>
      <p class="muted starting">Starting the local server and media engine…</p>
      <div class="spinner"></div>
      <div class="error">
        <h2>Lingua Franca could not start</h2>
        <p id="detail"></p>
        <ul class="muted">
          <li>Check whether another copy of Lingua Franca is already running.</li>
          <li>Confirm nothing else is using TCP port 4173 or 4174.</li>
          <li>Restart the computer if the media engine will not load.</li>
        </ul>
      </div>
    </div>
    <script>
      var detail = new URLSearchParams(location.search).get('error');
      if (detail) {
        document.getElementById('detail').textContent = detail;
        document.body.classList.add('failed');
      }
    </script>
  </body>
</html>
